extends:
  - eslint-config-dmitmel/presets/node
  - eslint-config-dmitmel/presets/vitest

parserOptions:
  ecmaVersion: 2017

settings:
  # <https://eslint-community.github.io/eslint-plugin-es-x/#the-aggressive-mode>
  es-x: { aggressive: true }

overrides:
  - files: 'main.js'
    rules:
      n/no-unsupported-features/es-syntax:
        - error
        - ignores: ['hashbang']

  - files: ['*.test.js', 'vitest.config.mjs']
    settings:
      node:
        version: '>= 24.0.0'
