extends: eslint-config-dmitmel/presets/node
parserOptions:
  ecmaVersion: 2017
env:
  jest: true

overrides:
  - files: 'main.js'
    rules:
      n/no-unsupported-features/es-syntax:
        - error
        - ignores: ['hashbang']

  - files: '*.test.js'
    settings:
      node:
        version: '>= 24.0.0'
