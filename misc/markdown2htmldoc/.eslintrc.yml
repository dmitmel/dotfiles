extends:
  - eslint-config-dmitmel/presets/node
  - eslint-config-dmitmel/presets/vitest

parserOptions:
  ecmaVersion: 2017

overrides:
  - files: 'main.js'
    rules:
      n/no-unsupported-features/es-syntax:
        - error
        - ignores: ['hashbang']

  - files: ['*.test.js', 'vitest.config.mjs']
    settings:
      node:
        version: '>= 24.0.0'
